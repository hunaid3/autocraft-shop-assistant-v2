name: Deploy

# Runs after CI passes on main (or by hand). Builds the container, pushes it to ECR in Mumbai and
# rolls the ECS service. AWS access is by OIDC: no keys are stored in GitHub. The AWS role trusts only
# subject repo:hunaid3@15307362/autocraft-shop-assistant-v2@1447428790:ref:refs/heads/main (GitHub's IDs).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: autocraft/shop-assistant

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886069266990:role/autocraft-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: engine
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            RELEASE=${{ steps.image.outputs.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: autocraft
          service: shop-assistant
          wait-for-service-stability: true
          wait-for-minutes: 15
